name: Build Windows exe
on:
  push:
    tags: ["v*"] # se déclenche quand vous créez un tag, ex. v0.1.0
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install . pyinstaller
      - run: >
          pyinstaller --onefile --name pdf2docx
          --add-data "pdf2docx/web;pdf2docx/web"
          --collect-all pymupdf
          run_gui.py
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/pdf2docx.exe
